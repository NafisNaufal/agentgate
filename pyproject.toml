[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgate"
version = "0.3.0"
description = "A pre-action guardrail for AI agent tool calls."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # Audit logging is mandatory (PRD F14), and it is backed by Postgres.
    # Everything else in the engine is stdlib-only.
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
browser = ["playwright>=1.45"]

[project.scripts]
agentgate = "agentgate.cli:main"

[tool.setuptools.packages.find]
include = ["agentgate*"]

[tool.setuptools.package-data]
"agentgate" = ["scenarios/*.json"]
"agentgate.policy" = ["packs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
